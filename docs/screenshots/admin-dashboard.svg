  <text x="420" y="612" font-family="Tahoma, Segoe UI, sans-serif" font-size="12.5" fill="#4b5a60" text-anchor="end">• محرر المحتوى (Content Editor): تحرير المقالات والمسرد والأسئلة</text>
  <text x="420" y="636" font-family="Tahoma, Segoe UI, sans-serif" font-size="12.5" fill="#4b5a60" text-anchor="end">• مراجع طبي موثق (Medical Reviewer): الاعتماد الطبي فقط</text>
