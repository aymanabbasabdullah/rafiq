name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/build
          retention-days: 1

  backend:
    name: Backend (${{ matrix.database }})
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: rafiq_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: public/build
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: composer audit
      - name: Tests (SQLite)
        if: matrix.database == 'sqlite'
        run: php artisan test
      - name: Tests (MySQL)
        if: matrix.database == 'mysql'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: rafiq_testing
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test
      - name: No secrets or Gemini config in the frontend bundle (AI-014)
        run: |
          ! grep -rIl "GEMINI" resources/js public/build
